# Harizco Post: local Stalwart mailbox store (Docker Compose)
#
# Pinned to the same release the Task 5 fixtures use (v0.16.25), so the
# production store and the tested primitives are the same version.
#
# Exposure rules (from the plan, line 124): this store is for the local app
# only. EVERY published port binds 127.0.0.1 — mail.atelieriza.com must reach
# the UI + its API, never Stalwart's WebUI, JMAP, database, or SMTP. Widening a
# bind to 0.0.0.0 here would bypass the Cloudflare Access gate.
#
# Volume paths are dictated by the image: it declares BOTH /etc/stalwart
# (configuration) and /var/lib/stalwart (data store). Mounting anywhere else
# (e.g. /opt/stalwart) leaves the real state on an anonymous volume that a
# recreate silently discards — verified against the running container.
#
# The bootstrap/admin secret comes from .env (gitignored, 0600); it is never
# baked into this file. Absent that file, Compose fails rather than starting
# with a guessable credential.

services:
  stalwart:
    image: stalwartlabs/stalwart:v0.16.25
    container_name: harizco-stalwart
    restart: unless-stopped
    # Recovery/bootstrap mode lets the first boot accept the generated admin
    # credential; the management JMAP API then performs the real configuration
    # (Stalwart 0.16.25 uses a JSON data store, not the older TOML).
    environment:
      # Opt-in, NOT a default: forcing this true keeps the store in recovery
      # mode forever (recovery listener only) even after config.json exists,
      # because the env var overrides the written configuration. Bootstrap with
      #   STALWART_RECOVERY_MODE=true sg docker -c 'docker compose up -d'
      # then leave it unset for normal operation.
      STALWART_RECOVERY_MODE: "${STALWART_RECOVERY_MODE:-false}"
      STALWART_RECOVERY_ADMIN: "${STALWART_RECOVERY_ADMIN:-}"
      # Advertise the loopback origin so discovered session URLs never leak a
      # host-derived HTTPS URL the local client cannot reach.
      STALWART_PUBLIC_URL: "http://127.0.0.1:8080"
    ports:
      # Loopback-only. Do not change these to 0.0.0.0.
      - "127.0.0.1:8080:8080"   # HTTP + JMAP (management and normal)
    volumes:
      - stalwart-config:/etc/stalwart
      - stalwart-data:/var/lib/stalwart
    healthcheck:
      # The image ships curl but not wget. Any HTTP response (bootstrap mode
      # answers 302) proves the management listener is up; curl exits non-zero
      # only on a transport failure, which is exactly the unhealthy case.
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  stalwart-config:
    name: harizco-stalwart-config
  stalwart-data:
    name: harizco-stalwart-data
